<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="/static/style.css">
    <meta charset="UTF-8">
    <title>Edit post</title>
</head>
<body>
    <form method="POST">
        <label>Title</label>
            <input type="text" name="title" required>
            <br>
        <label>Content</label>
            <textarea rows="5" name="content" required></textarea>
            <br>
        <button type="submit">Change post</button>
    </form>
</body>
</html>
